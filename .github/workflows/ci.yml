name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # Debian trixie's Python, as shipped in the ISO
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: ShellCheck
        run: shellcheck -S warning build.sh write-usb.sh docker/build-in-container.sh tools/*.sh
