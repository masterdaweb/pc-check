# Turn kernel crashes and lockups into a reboot so they are detected and reported.
kernel.panic = 10
kernel.panic_on_oops = 1
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
kernel.unknown_nmi_panic = 0
# Keep the console quiet so the dashboard stays readable; everything is logged to USB.
kernel.printk = 3 4 1 3
vm.panic_on_oom = 0
