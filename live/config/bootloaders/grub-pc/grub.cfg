source /boot/grub/config.cfg

# The default entry passes no profile, so pccheck.conf on the PCCHECKDATA
# partition (or the built-in "standard" profile) decides what runs.
menuentry "PC-Check: automatic burn-in (default: standard ~12h)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "PC-Check: quick smoke test (~1h)" --hotkey=q {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ pccheck.profile=quick
	initrd	@INITRD_LIVE@
}

menuentry "PC-Check: extended burn-in (~24h)" --hotkey=e {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ pccheck.profile=extended
	initrd	@INITRD_LIVE@
}

menuentry "PC-Check: full burn-in (~72h)" --hotkey=f {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ pccheck.profile=burnin
	initrd	@INITRD_LIVE@
}

submenu "Advanced options..." --hotkey=a {

	source /boot/grub/theme.cfg

	menuentry "Standard burn-in + DESTRUCTIVE disk write/verify (ERASES blank non-boot disks)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ pccheck.profile=standard pccheck.destructive=1
		initrd	@INITRD_LIVE@
	}

	menuentry "Extended burn-in + DESTRUCTIVE disk write/verify (ERASES blank non-boot disks)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ pccheck.profile=extended pccheck.destructive=1
		initrd	@INITRD_LIVE@
	}

	menuentry "Safe graphics (nomodeset) + standard burn-in" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
		initrd	@INITRD_LIVE@
	}

	menuentry "Maintenance mode (no tests, root shell on tty2)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ pccheck.auto=0
		initrd	@INITRD_LIVE@
	}

	menuentry "Load system into RAM (toram) + standard burn-in" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram
		initrd	@INITRD_LIVE@
	}
}

submenu "Utilities..." --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest86+ (runs outside Linux, not included in the automatic report)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi
}
